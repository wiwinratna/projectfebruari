<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Font (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* ===== PRINT LOCK ===== */
    @page { size: A5 portrait; margin: 0; }

    *{
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      box-sizing: border-box;
    }

    html, body { margin:0; padding:0; }

    /* ===== FONT BASE (SAFE) ===== */
    html, body{
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: geometricPrecision;
    }

    /* preview mode background */
    body.preview-bg{ background:#f3f4f6; }

    /* ===== WRAP =====
       - preview: center + bisa banyak page (batch)
       - print: rapat tanpa gap
    */
    .wrap{
      min-height:100vh;
      display:flex;
      flex-direction:column;    /* ✅ penting: batch tetap kebawah */
      align-items:center;       /* ✅ center horizontal */
      gap:16px;                 /* ✅ jarak antar kartu saat preview */
      padding:24px 16px;
    }

    @media print {
      html, body { background:#fff !important; }
      body.preview-bg{ background:#fff !important; }
      .wrap{
        padding:0 !important;
        gap:0 !important;       /* ✅ jangan ada gap pas print */
      }
      .no-print{ display:none !important; }
    }

    /* ===== A5 SHEET ===== */
    .page{
      width:148mm;
      height:210mm;
      background:#fff;
      position:relative;
      overflow:hidden;
    }

    /* ✅ 1 CARD = 1 SHEET (BATCH PRINT FIX) */
    @media print {
      .page{
        page-break-after: always;
        break-after: page;
      }
      .page:last-child{
        page-break-after: auto;
        break-after: auto;
      }
    }

    /* ===== DEFAULT BLANK TEMPLATE: ONLY MIDDLE AREA PRINTED ===== */
    :root{
      --left: 10mm;
      --top: 35mm;
      --width: 128mm;
      --height: 140mm;

      /* typographic colors */
      --ink-strong:#111827;
      --ink:#374151;
      --ink-soft:#6b7280;

      --chip-bg: rgba(17,24,39,.06);
      --chip-border: rgba(17,24,39,.12);
    }

    .content{
      position:absolute;
      left:var(--left);
      top:var(--top);
      width:var(--width);
      height:var(--height);
    }

    /* ===== CARD CANVAS ===== */
    .card{ position:relative; width:100%; height:100%; }

    /* photo */
    .photo{
      position:absolute;
      left:0;
      top:0;
      width:55mm;
      height:66mm;
      border-radius:4px;
      overflow:hidden;
      background:#e5e7eb;
    }
    .photo img{ width:100%; height:100%; object-fit:cover; display:block; }

    /* acc block (D) */
    .accWrap{
      position:absolute;
      right:0;
      top:0;               /* ✅ tetap di atas */
      width:64mm;
      height:62mm;
      border-radius: 0 10px 0 10px;
      background:#fff;
      overflow:hidden;
      border:0;
    }

    .accBar{
      height:24mm;
      line-height:24mm;
      text-align:center;
      font-weight:900;
      font-size:55pt;
      color:#fff;
      letter-spacing:0.3px;

      /* ungu ikut rounded */
      border-radius: 0 0 0 20px;
    }

    /* ===== LEFT AREA (FLOW) =====
       Start-nya tetap ngikut posisi kamu (70mm).
       Elemen bawah ikut turun otomatis.
    */
    .leftCol{
      position:absolute;
      left:0;
      top:70mm;            /* ✅ ini sesuai posisi name kamu */
      width:70mm;
    }

    .name{
      font-size:19pt;
      font-weight:800;
      color:var(--ink-strong);
      line-height:1.12;
      word-break:break-word;
      letter-spacing:0.1px;

      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;

      max-height:2.25em;
      padding-bottom:0.6mm;
    }

    .meta{
      margin-top:2mm;
      font-size:12pt;
      color:var(--ink-soft);
      font-weight:500;
      line-height:1.25;
    }

    .privTitle, .accessTitle{
      margin-top:5mm;
      font-size:9pt;
      color:var(--ink);
      font-weight:600;
      letter-spacing:0.2px;
    }

    .chipRow, .accessRow{
      margin-top:2mm;
      display:flex;
      gap:2mm;
      flex-wrap:wrap;
      max-width:70mm;
    }

    .chip{
      padding:1.6mm 2.4mm;
      border:1px solid var(--chip-border);
      border-radius:1mm;
      font-size:12pt;
      font-weight:700;
      color:var(--ink-strong);
      background:var(--chip-bg);
      display:inline-flex;
      align-items:center;
      gap:1.0mm;
      white-space:nowrap;
      line-height:1;
      letter-spacing:0.1px;
    }

    .mono{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-weight:600;
    }

    /* icon sizing (SVG/IMG) */
    .chip svg{
      width:12pt; height:12pt;
      display:inline-block;
      vertical-align:middle;
      opacity:.92;
    }
    .chip img.icon{
      width:12pt; height:12pt;
      display:inline-block;
      vertical-align:middle;
      opacity:.92;
    }

    /* QR */
    .qrBox{
      position:absolute;
      right:-5mm;
      top:72mm;            /* ✅ tetap */
      width:56mm;
      height:56mm;
      overflow:hidden;
      background:transparent;
      border:none;
      border-radius:0;
    }
    .qrBox img{ width:100%; height:100%; display:block; }

  </style>
</head>

<!-- Auto shrink name (max 2 lines) -->
<script>
(function(){
  function shrinkName(el, minPt=12){
    if(!el) return;
    const maxH = parseFloat(getComputedStyle(el).maxHeight);
    if(!maxH || isNaN(maxH)) return;

    let sizePx = parseFloat(getComputedStyle(el).fontSize);
    const minPx = minPt * 1.333;

    while(el.scrollHeight > maxH + 0.5 && sizePx > minPx){
      sizePx -= 1;
      el.style.fontSize = sizePx + "px";
    }
  }

  window.addEventListener('load', () => {
    document.querySelectorAll('.name').forEach(el => shrinkName(el, 12));
  });
})();
</script>
